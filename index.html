<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin: 0; font-family: Arial, sans-serif; }
h2 { text-align: center; margin: 10px; }

/* MAP */
#map { height: 92vh; width: 100%; }

/* PANEL KIRI */
.panel{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
    background:white;
    padding:15px;
    border-radius:10px;
    font-size:12px;
    width:220px;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
}

.panel input[type="text"]{
    width:100%;
    padding:6px;
    border:1px solid #ccc;
    border-radius:5px;
    margin:5px 0 10px 0;
}

.panel label{
    display:block;
    margin-bottom:3px;
}

/* CHART */
.chartBox{
    position:absolute;
    bottom:10px;
    left:10px;
    width:320px;
    height:220px;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
}

/* LEGENDA */
.legend {
    background: white;
    padding: 10px;
    line-height: 18px;
    border-radius: 5px;
}

/* POPUP */
.leaflet-popup-content{
    max-height:200px;
    overflow-y:auto;
}
</style>
</head>

<body>

<h2>Peta Pengurus Jaga Leuweung</h2>

<div class="panel">
    <b>🔍 Search Nama</b>
    <input type="text" id="search" placeholder="Cari nama...">

    <b>📊 Filter CDK</b>
    <div id="filterCDK"></div>
</div>

<div id="map"></div>

<div class="chartBox">
    <b>Grafik Jumlah Peserta per CDK</b>
    <canvas id="chart"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ================= BASEMAP =================
var map = L.map('map').setView([-6.9,107.6],8);

var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png');
var satelit = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{
    subdomains:['mt0','mt1','mt2','mt3']
});
var medan = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',{
    subdomains:['mt0','mt1','mt2','mt3']
});

osm.addTo(map);

var baseMaps = {
    "OSM": osm,
    "Satelit": satelit,
    "Medan": medan
};

L.control.layers(baseMaps).addTo(map);

// ================= WARNA CDK =================
function getColor(cdk){
    return cdk == "CDK I" ? "red" :
           cdk == "CDK II" ? "blue" :
           cdk == "CDK III" ? "green" :
           cdk == "CDK IV" ? "orange" :
           cdk == "CDK V" ? "purple" :
           cdk == "CDK VI" ? "brown" :
           cdk == "CDK VII" ? "pink" :
           cdk == "CDK VIII" ? "yellow" :
           cdk == "CDK IX" ? "black" : "gray";
}

// ================= GLOBAL =================
var allFeatures = [];
var activeCDK = new Set();
var geoLayer;
var chart;

// ================= BATAS ADMIN =================
fetch('Jawa Barat.geojson')
.then(res=>res.json())
.then(data=>{
    L.geoJSON(data,{
        style:{color:"black",weight:0.5,fillOpacity:0}
    }).addTo(map);
});

// ================= DATA PJL =================
fetch('PJL.geojson')
.then(res=>res.json())
.then(data=>{
    allFeatures = data.features;

    let cdkSet = new Set(allFeatures.map(f=>f.properties.cdk));
    let filterDiv = document.getElementById("filterCDK");

    cdkSet.forEach(cdk=>{
        activeCDK.add(cdk);
        filterDiv.innerHTML += 
        `<label>
        <input type="checkbox" checked value="${cdk}"> ${cdk}
        </label>`;
    });

    updateMap();

    filterDiv.addEventListener("change",()=>{
        activeCDK.clear();
        document.querySelectorAll("#filterCDK input:checked")
        .forEach(i=>activeCDK.add(i.value));
        updateMap();
    });

    document.getElementById("search")
    .addEventListener("input", updateMap);
});

// ================= UPDATE MAP =================
function updateMap(){
    if(geoLayer){
        map.removeLayer(geoLayer);
    }

    let keyword = document.getElementById("search").value.toLowerCase();
    let countCDK = {};

    geoLayer = L.geoJSON(allFeatures,{
        pointToLayer: function(feature){
            let lat = parseFloat(feature.properties["koordinat desa (lat)"]);
            let lng = parseFloat(feature.properties["koordinat desa (long)"]);

            if(isNaN(lat) || isNaN(lng)) return null;

            return L.circleMarker([lat,lng],{
                radius: 1,
                color:getColor(feature.properties.cdk),
                fillColor:getColor(feature.properties.cdk),
                fillOpacity:1
            });
        },

        filter: function(feature){
            let p = feature.properties;
            return activeCDK.has(p.cdk) &&
                   (p.nama || "").toLowerCase().includes(keyword);
        },

        onEachFeature: function(feature,layer){
            let p = feature.properties;

            layer.bindPopup(`
            <b>Nama:</b> ${p.nama || "-"}<br>
            <b>NIK:</b> ${p.nik || "-"}<br>
            <b>Usia:</b> ${p["usia(tahun)"] || "-"} tahun<br>
            <b>Alamat:</b> ${p.alamat || "-"}<br>
            <b>Desa:</b> ${p.desa || "-"}<br>
            <b>Kecamatan:</b> ${p.kecamatan || "-"}<br>
            <b>Kabupaten:</b> ${p.kabupaten || "-"}<br><br>
            <b>Koordinat Desa:</b><br>
            (${p["koordinat desa (lat)"]}, ${p["koordinat desa (long)"]})<br><br>
            <b>Koordinat Calon Lokasi Persemaian:</b><br>
            (${p["koordinat calon lokasi persemaian (x)"]}, ${p["koordinat calon lokasi persemaian (y)"]})<br><br>
            <b>Koordinat Calon Lokasi Penanaman:</b><br>
            (${p["koordinat calon lokasi penanaman (x)"]}, ${p["koordinat calon lokasi penanaman (y)"]})<br><br>
            <b>Penyuluh Kehutanan Pendamping:</b> ${p["penyuluh kehutanan pendamping"] || "-"}<br>
            <b>Keterangan:</b> ${p.keterangan || "-"}<br>
            <b>CDK:</b> ${p.cdk || "-"}
            `);

            countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;
        }

    }).addTo(map);

    updateChart(countCDK);
}

// ================= CHART =================
function updateChart(data){

    let labels = Object.keys(data);
    let values = Object.values(data);

    if(labels.length === 0){
        labels = ["Tidak ada data"];
        values = [0];
    }

    if(!chart){
        chart = new Chart(document.getElementById("chart"),{
            type:'bar',
            data:{
                labels: labels,
                datasets:[{
                    label:'Jumlah Peserta',
                    data: values
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                scales:{
                    y:{
                        beginAtZero:true,
                        ticks:{ precision:0 }
                    }
                }
            }
        });
    } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
    }
}

// ================= LEGENDA =================
var legend = L.control({position:"bottomright"});
legend.onAdd = function(){
    var div = L.DomUtil.create("div","legend");
    div.innerHTML += "<b>Legenda CDK</b><br>";

    ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"]
    .forEach(cdk=>{
        div.innerHTML += 
        `<i style="background:${getColor(cdk)};
        width:12px;height:12px;display:inline-block;"></i> ${cdk}<br>`;
    });

    return div;
};
legend.addTo(map);

</script>
</body>
</html>
