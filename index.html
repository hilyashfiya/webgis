<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin: 0; font-family: Arial; }
#map { height: 100vh; }

/* JUDUL PETA */
.titleMap {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    z-index: 1000;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
}

/* PANEL */
.panel {
    position: absolute;
    top: 80px;
    left: 10px;
    width: 260px;
    background: #2e7d32;
    color: white;
    padding: 15px;
    border-radius: 10px;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    max-height: 80vh;
    overflow-y: auto;
}

.panel input[type="text"] {
    width: 100%;
    padding: 6px;
    border-radius: 5px;
    border: none;
    margin-bottom: 10px;
}

.panel button {
    width: 100%;
    padding: 6px;
    border: none;
    border-radius: 5px;
    background: #1b5e20;
    color: white;
    margin-top: 5px;
    cursor: pointer;
}

/* CHART */
.chartBox {
    position: absolute;
    bottom: 15px;
    right: 15px;
    width: 320px;
    height: 220px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    z-index: 1000;
}

/* SUMMARY */
.summary {
    position: absolute;
    bottom: 240px;
    right: 15px;
    width: 320px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    z-index: 1000;
    font-size: 13px;
}

/* LEGENDA */
.legend {
    background: white;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
}
</style>
</head>

<body>

<div id="map"></div>
<div class="titleMap">Sebaran Pengurus Jaga Leuweung Provinsi Jawa Barat</div>

<!-- PANEL -->
<div class="panel">
    <b>🔍 Cari (Nama / Desa / CDK)</b>
    <input type="text" id="searchInput" placeholder="Cari...">
    <button onclick="resetFilter()">Reset Filter</button>

    <b>🗺️ Layer</b>
    <label><input type="checkbox" id="toggleBatas" checked> Batas Administrasi</label>
    <label><input type="checkbox" id="togglePJL" checked> Titik PJL</label>

    <b>📊 Filter CDK</b>
    <label><input type="checkbox" class="cdk" value="CDK I" checked> CDK I</label>
    <label><input type="checkbox" class="cdk" value="CDK II" checked> CDK II</label>
    <label><input type="checkbox" class="cdk" value="CDK III" checked> CDK III</label>
    <label><input type="checkbox" class="cdk" value="CDK IV" checked> CDK IV</label>
    <label><input type="checkbox" class="cdk" value="CDK V" checked> CDK V</label>
    <label><input type="checkbox" class="cdk" value="CDK VI" checked> CDK VI</label>
    <label><input type="checkbox" class="cdk" value="CDK VII" checked> CDK VII</label>
    <label><input type="checkbox" class="cdk" value="CDK VIII" checked> CDK VIII</label>
    <label><input type="checkbox" class="cdk" value="CDK IX" checked> CDK IX</label>
</div>

<!-- SUMMARY -->
<div class="summary" id="summaryBox">
    <b>Summary Statistik</b><br>
    Jumlah Titik: 0
</div>

<!-- CHART -->
<div class="chartBox">
    <canvas id="chartCDK"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// MAP
var map = L.map('map').setView([-6.9,107.6],9);

// BASEMAP
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var satelit = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');
var medan = L.tileLayer('https://{s}.tile.stamen.com/terrain/{z}/{x}/{y}.jpg');

osm.addTo(map);

var baseMaps = {
    "OpenStreetMap": osm,
    "Satelit": satelit,
    "Medan": medan
};

L.control.layers(baseMaps).addTo(map);
L.control.scale().addTo(map);

// WARNA CDK
function getColor(cdk){
    return {
        "CDK I":"red","CDK II":"blue","CDK III":"green",
        "CDK IV":"orange","CDK V":"purple","CDK VI":"brown",
        "CDK VII":"pink","CDK VIII":"gray","CDK IX":"black"
    }[cdk] || "yellow";
}

// GANTI NULL
function isiData(v){
    if(v == null || v == "" || v == undefined){
        return "Data Tidak Tersedia";
    }
    return v;
}

var batasLayer, pjlLayer, chart;
var allData;

// BATAS
fetch("Jawa Barat.geojson")
.then(res=>res.json())
.then(data=>{
    batasLayer = L.geoJSON(data,{
        style:{color:"black",weight:0.5,fillOpacity:0}
    }).addTo(map);
});

// PJL
fetch("PJL.geojson")
.then(res=>res.json())
.then(data=>{
    allData = data;
    updateMap();
});

// UPDATE
function updateMap(){

    if(pjlLayer) map.removeLayer(pjlLayer);

    let keyword = document.getElementById("searchInput").value.toLowerCase();
    let selectedCDK = [...document.querySelectorAll(".cdk:checked")].map(i=>i.value);

    let countCDK = {};
    let total = 0;
    let bounds = [];

    pjlLayer = L.geoJSON(allData,{
        filter: function(f){
            let p = f.properties;
            return selectedCDK.includes(p.cdk) &&
            (
            (p.nama||"").toLowerCase().includes(keyword) ||
            (p.desa||"").toLowerCase().includes(keyword) ||
            (p.cdk||"").toLowerCase().includes(keyword)
            );
        },

        pointToLayer: function(f,latlng){
            let warna = getColor(f.properties.cdk);

            if(keyword != "") warna = "yellow";

            bounds.push(latlng);
            total++;

            return L.circleMarker(latlng,{
                radius: 1,
                color: warna,
                fillColor: warna,
                fillOpacity: 1
            });
        },

        onEachFeature: function(f,l){
            let p = f.properties;

            l.bindPopup(`
            <b>Nama:</b> ${isiData(p.nama)}<br>
            <b>NIK:</b> ${isiData(p.nik)}<br>
            <b>Usia:</b> ${isiData(p["usia(tahun)"])} tahun<br>
            <b>Alamat:</b> ${isiData(p.alamat)}<br>
            <b>Desa:</b> ${isiData(p.desa)}<br>
            <b>Kecamatan:</b> ${isiData(p.kecamatan)}<br>
            <b>Kabupaten:</b> ${isiData(p.kabupaten)}<br><br>
            <b>Koordinat Desa:</b><br>
            (${isiData(p["koordinat desa (lat)"])}, ${isiData(p["koordinat desa (long)"])})<br><br>
            <b>Koordinat Calon Lokasi Persemaian:</b><br>
            (${isiData(p["koordinat calon lokasi persemaian (x)"])}, ${isiData(p["koordinat calon lokasi persemaian (y)"])})<br><br>
            <b>Koordinat Calon Lokasi Penanaman:</b><br>
            (${isiData(p["koordinat calon lokasi penanaman (x)"])}, ${isiData(p["koordinat calon lokasi penanaman (y)"])})<br><br>
            <b>Penyuluh Kehutanan Pendamping:</b> ${isiData(p["penyuluh kehutanan pendamping"])}<br>
            <b>Keterangan:</b> ${isiData(p.keterangan)}<br>
            <b>CDK:</b> ${isiData(p.cdk)}
            `);

            countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;

            // ZOOM SAAT KLIK
            l.on('click', function(){
                map.setView(latlng, 14);
            });
        }
    });

    if(document.getElementById("togglePJL").checked){
        pjlLayer.addTo(map);
    }

    // AUTO ZOOM HASIL PENCARIAN
    if(bounds.length > 0 && keyword != ""){
        map.fitBounds(bounds);
    }

    updateChart(countCDK);
    updateSummary(countCDK, total);
}

// SUMMARY
function updateSummary(data,total){
    let html = "<b>Summary Statistik</b><br>";
    html += "Jumlah Titik: " + total + "<br><br>";
    for(let c in data){
        html += c + ": " + data[c] + "<br>";
    }
    document.getElementById("summaryBox").innerHTML = html;
}

// RESET
function resetFilter(){
    document.getElementById("searchInput").value="";
    document.querySelectorAll(".cdk").forEach(cb=>cb.checked=true);
    updateMap();
}

// CHART
function updateChart(data){
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chartCDK"),{
        type:'bar',
        data:{
            labels:Object.keys(data),
            datasets:[{data:Object.values(data)}]
        },
        options:{
            plugins:{
                legend:{display:false},
                title:{
                    display:true,
                    text:'Jumlah PJL per CDK'
                }
            }
        }
    });
}

// EVENT
document.getElementById("toggleBatas").addEventListener("change",function(){
    if(this.checked){ map.addLayer(batasLayer); }
    else{ map.removeLayer(batasLayer); }
});

document.getElementById("togglePJL").addEventListener("change",updateMap);
document.getElementById("searchInput").addEventListener("keyup",updateMap);
document.querySelectorAll(".cdk").forEach(cb=>{
    cb.addEventListener("change",updateMap);
});

// LEGENDA
var legend = L.control({position:"topright"});
legend.onAdd = function(){
    var div = L.DomUtil.create("div","legend");
    div.innerHTML = "<b>Legenda CDK</b><br>";
    ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"]
    .forEach(c=>{
        div.innerHTML += `<i style="background:${getColor(c)};
        width:12px;height:12px;display:inline-block;"></i> ${c}<br>`;
    });
    return div;
};
legend.addTo(map);

</script>

</body>
</html>
