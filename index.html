<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin: 0; font-family: Arial; }
#map { height: 100vh; }

/* JUDUL */
.titleMap {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    z-index: 1000;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
}

/* PANEL */
.panel {
    position: absolute;
    top: 80px;
    left: 10px;
    width: 220px;
    background: #2e7d32;
    color: white;
    padding: 15px;
    border-radius: 10px;
    z-index: 1000;
}

/* SUMMARY */
.summary {
    position: absolute;
    bottom: 240px;
    left: 10px;
    width: 260px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    z-index: 1000;
    font-size: 13px;
}

/* CHART */
.chartBox {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 260px;
    height: 200px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    z-index: 1000;
}

/* LEGENDA */
.legend {
    background: white;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
}
</style>
</head>

<body>

<div id="map"></div>
<div class="titleMap">Sebaran Pengurus Jaga Leuweung Provinsi Jawa Barat</div>

<div class="panel">
    <b>Filter CDK (Klik Legenda)</b><br><br>
    <button onclick="resetFilter()">Tampilkan Semua CDK</button>
</div>

<div class="summary" id="summaryBox"></div>

<div class="chartBox">
    <canvas id="chartCDK"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAP
var map = L.map('map').setView([-6.9,107.6],9);

// BASEMAP
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var satelit = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');
var medan = L.tileLayer('https://{s}.tile.stamen.com/terrain/{z}/{x}/{y}.jpg');

osm.addTo(map);
L.control.layers({
    "OSM": osm,
    "Satelit": satelit,
    "Medan": medan
}).addTo(map);

// WARNA CDK
function getColor(cdk){
    return {
        "CDK I":"red","CDK II":"blue","CDK III":"green",
        "CDK IV":"orange","CDK V":"purple","CDK VI":"brown",
        "CDK VII":"pink","CDK VIII":"gray","CDK IX":"black"
    }[cdk] || "yellow";
}

// DATA KOSONG
function isiData(v){
    return (!v || v=="") ? "Data Tidak Tersedia" : v;
}

var batasLayer, pjlLayer, chart;
var allData;

let activeCDK = ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"];

// LOAD BATAS ADMINISTRASI (SELALU TAMPIL)
fetch("Jawa Barat.geojson")
.then(res=>res.json())
.then(data=>{
    batasLayer = L.geoJSON(data,{
        style:{color:"black",weight:0.5,fillOpacity:0}
    }).addTo(map);
});

// LOAD PJL
fetch("PJL.geojson")
.then(res=>res.json())
.then(data=>{
    allData = data;
    updateMap();
});

// UPDATE MAP
function updateMap(){

    if(pjlLayer) map.removeLayer(pjlLayer);

    let countCDK = {};
    let boundsByCDK = {};
    let total = 0;

    pjlLayer = L.geoJSON(allData,{
        filter: function(f){
            return activeCDK.includes(f.properties.cdk);
        },

        pointToLayer: function(f,latlng){
            let warna = getColor(f.properties.cdk);
            total++;

            return L.circleMarker(latlng,{
                radius: 1,
                color: warna,
                fillColor: warna,
                fillOpacity: 1
            });
        },

        onEachFeature: function(f,l){
            let p = f.properties;

            l.bindPopup(`
            <b>Nama:</b> ${isiData(p.nama)}<br>
            <b>NIK:</b> ${isiData(p.nik)}<br>
            <b>Usia:</b> ${isiData(p["usia(tahun)"])} tahun<br>
            <b>Alamat:</b> ${isiData(p.alamat)}<br>
            <b>Desa:</b> ${isiData(p.desa)}<br>
            <b>Kecamatan:</b> ${isiData(p.kecamatan)}<br>
            <b>Kabupaten:</b> ${isiData(p.kabupaten)}<br><br>
            <b>Koordinat Desa:</b><br>
            (${isiData(p["koordinat desa (lat)"])}, ${isiData(p["koordinat desa (long)"])})<br><br>
            <b>Koordinat Calon Lokasi Persemaian:</b><br>
            (${isiData(p["koordinat calon lokasi persemaian (x)"])}, ${isiData(p["koordinat calon lokasi persemaian (y)"])})<br><br>
            <b>Koordinat Calon Lokasi Penanaman:</b><br>
            (${isiData(p["koordinat calon lokasi penanaman (x)"])}, ${isiData(p["koordinat calon lokasi penanaman (y)"])})<br><br>
            <b>Penyuluh Kehutanan Pendamping:</b> ${isiData(p["penyuluh kehutanan pendamping"])}<br>
            <b>Keterangan:</b> ${isiData(p.keterangan)}<br>
            <b>CDK:</b> ${isiData(p.cdk)}
            `);

            countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;

            if(!boundsByCDK[p.cdk]) boundsByCDK[p.cdk] = [];
            boundsByCDK[p.cdk].push(l.getLatLng());

            l.on('click', function(){
                map.setView(l.getLatLng(), 14);
            });
        }
    }).addTo(map);

    updateSummary(countCDK,total);
    updateChart(countCDK,boundsByCDK);
}

// SUMMARY TOP 3
function updateSummary(data,total){
    let sorted = Object.entries(data)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3);

    let html = "<b>Top 3 CDK</b><br>Total Titik: "+total+"<br><br>";
    sorted.forEach(d=>{
        html += d[0]+" : "+d[1]+"<br>";
    });

    document.getElementById("summaryBox").innerHTML = html;
}

// CHART INTERAKTIF
function updateChart(data,boundsByCDK){

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chartCDK"),{
        type:'bar',
        data:{
            labels:Object.keys(data),
            datasets:[{data:Object.values(data)}]
        },
        options:{
            onClick: function(evt,item){
                if(item.length){
                    let cdk = this.data.labels[item[0].index];

                    activeCDK = [cdk];
                    updateMap();

                    if(boundsByCDK[cdk]){
                        map.fitBounds(boundsByCDK[cdk]);
                    }
                }
            },
            plugins:{
                legend:{display:false},
                title:{
                    display:true,
                    text:'Klik Bar = Filter & Zoom'
                }
            }
        }
    });
}

// RESET
function resetFilter(){
    activeCDK = ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"];
    updateMap();
}

// LEGENDA INTERAKTIF
var legend = L.control({position:"topright"});

legend.onAdd = function(){
    var div = L.DomUtil.create("div","legend");
    div.innerHTML = "<b>Klik CDK</b><br>";

    ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"]
    .forEach(c=>{
        let aktif = activeCDK.includes(c);

        div.innerHTML += `
        <div onclick="toggleCDK('${c}')"
        style="cursor:pointer; opacity:${aktif?1:0.3}">
        <i style="background:${getColor(c)};
        width:12px;height:12px;display:inline-block;"></i> ${c}
        </div>`;
    });

    return div;
};

legend.addTo(map);

// TOGGLE CDK
function toggleCDK(cdk){
    if(activeCDK.includes(cdk)){
        activeCDK = activeCDK.filter(c=>c!==cdk);
    } else {
        activeCDK.push(cdk);
    }

    updateMap();
    legend.remove();
    legend.addTo(map);
}

</script>

</body>
</html>
