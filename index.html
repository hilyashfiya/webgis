<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Peta Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<style>
body { margin:0; font-family:Arial; }
h2 { text-align:center; margin:10px; }
#map { height:92vh; }

.panel{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,0.3);
    font-size:12px;
}

#search{ width:100%; margin-bottom:5px; }

.legend{
    background:white;
    padding:10px;
    border-radius:5px;
}
</style>
</head>

<body>

<h2>Peta Pengurus Jaga Leuweung</h2>
<div id="map"></div>

<div class="panel">
<b>🔍 Cari Nama</b><br>
<input type="text" id="search" placeholder="ketik nama...">
<hr>
<b>Filter CDK</b><br>
<div id="filter"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

// ================= MAP =================
var map = L.map('map',{center:[-6.9,107.6],zoom:8});
var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var medan = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');

// ================= COLOR =================
function getColor(cdk){
    return {
        "CDK I":"red","CDK II":"blue","CDK III":"green",
        "CDK IV":"orange","CDK V":"purple","CDK VI":"brown",
        "CDK VII":"pink","CDK VIII":"yellow","CDK IX":"black"
    }[cdk] || "gray";
}

// ================= GLOBAL =================
var markers = L.markerClusterGroup();
var batasLayer;
var allData=[];
var activeCDK=new Set();

// ================= BATAS ADMIN =================
fetch('Jawa Barat.geojson')
.then(res=>res.json())
.then(data=>{
    batasLayer = L.geoJSON(data,{
        style:{color:"black",weight:0.5,fillOpacity:0}
    }).addTo(map);

    L.control.layers(
        {"OSM":osm,"Satelit":satelit,"Medan":medan},
        {"Pengurus":markers,"Batas Jabar":batasLayer}
    ).addTo(map);
});

// ================= DATA PJL =================
fetch('PJL.geojson')
.then(res=>res.json())
.then(data=>{

    allData = data.features;

    // ambil daftar CDK
    let cdkSet = new Set(allData.map(f=>f.properties.cdk));
    let filterDiv = document.getElementById("filter");

    cdkSet.forEach(cdk=>{
        activeCDK.add(cdk);
        filterDiv.innerHTML += `
        <label><input type="checkbox" checked value="${cdk}"> ${cdk}</label><br>`;
    });

    updateMap();

    // filter CDK
    filterDiv.addEventListener("change",()=>{
        activeCDK.clear();
        document.querySelectorAll("#filter input:checked")
        .forEach(i=>activeCDK.add(i.value));
        updateMap();
    });

    // search nama
    document.getElementById("search").addEventListener("input",updateMap);
});

// ================= UPDATE MAP =================
function updateMap(){

    markers.clearLayers();

    let keyword = document.getElementById("search").value.toLowerCase();

    allData.forEach(f=>{

        let p = f.properties;

        // filter
        if(!activeCDK.has(p.cdk)) return;
        if(!(p.nama || "").toLowerCase().includes(keyword)) return;

        // 🔥 AMBIL KOORDINAT DARI PROPERTIES (INI KUNCI FIX)
        let lat = parseFloat(p["koordinat desa (lat)"]);
        let lng = parseFloat(p["koordinat desa (long)"]);

        // kalau kosong skip
        if(isNaN(lat) || isNaN(lng)) return;

        // 🔥 PASTI BULAT (circle marker)
        let marker = L.circleMarker([lat,lng],{
            radius:1,
            color:"#fff",
            weight:1,
            fillColor:getColor(p.cdk),
            fillOpacity:0.9
        });

        // 🔥 POPUP FIX
        marker.bindPopup(`
            <b>Nama:</b> ${p.nama || "-"}<br>
            <b>NIK:</b> ${p.nik || "-"}<br>
            <b>Usia:</b> ${p["usia(tahun)"] || "-"} tahun<br>
            <b>Alamat:</b> ${p.alamat || "-"}<br>
            <b>Desa:</b> ${p.desa || "-"}<br>
            <b>Kecamatan:</b> ${p.kecamatan || "-"}<br>
            <b>Kabupaten:</b> ${p.kabupaten || "-"}<br><br>
            <b>Koordinat Desa:</b><br>
            (${lat}, ${lng})<br><br>
            <b>Koordinat Calon Lokasi Persemaian:</b><br>
            (${p["koordinat calon lokasi persemaian (x)"] || "-"}, ${p["koordinat calon lokasi persemaian (y)"] || "-"})<br><br>
            <b>Koordinat Calon Lokasi Penanaman:</b><br>
            (${p["koordinat calon lokasi penanaman (x)"] || "-"}, ${p["koordinat calon lokasi penanaman (y)"] || "-"})<br><br>
            <b>Penyuluh Kehutanan Pendamping:</b> ${p["penyuluh kehutanan pendamping"] || "-"}<br>
            <b>Keterangan:</b> ${p.keterangan || "-"}<br>
            <b>CDK:</b> ${p.cdk || "-"}
        `);

        markers.addLayer(marker);
    });

    map.addLayer(markers);
}

// ================= LEGENDA =================
var legend = L.control({position:"bottomright"});
legend.onAdd=function(){
    var div=L.DomUtil.create("div","legend");
    div.innerHTML="<b>Legenda CDK</b><br>"+
    "🔴 CDK I<br>🔵 CDK II<br>🟢 CDK III<br>🟠 CDK IV<br>🟣 CDK V<br>🟤 CDK VI<br>🌸 CDK VII<br>🟡 CDK VIII<br>⚫ CDK IX";
    return div;
};
legend.addTo(map);

</script>
</body>
</html>
