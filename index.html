<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>WebGIS Jaga Leuweung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        h2 {
            text-align: center;
            margin: 10px;
        }
        #map {
            height: 90vh;
            width: 100%;
        }
    </style>
</head>
<body>

<h2>Peta Pengurus Jaga Leuweung</h2>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Membuat peta
    var map = L.map('map').setView([-6.8, 107.0], 9);

    // Basemap OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Contoh titik
    L.marker([-6.723, 106.973])
        .addTo(map)
        .bindPopup("Contoh Titik Jaga Leuweung")
        .openPopup();
</script>

</body>
</html>
