<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Peta PJL Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#f4f6f9;
}

h2{
    text-align:center;
    margin:8px;
    font-size:18px;
}

#map {
    height:70vh;
    margin:8px;
    border-radius:10px;
}

.panel{
    position:absolute;
    top:70px;
    left:15px;
    z-index:1000;
    background:white;
    padding:8px;
    border-radius:8px;
    font-size:11px;
    width:160px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.panel input{
    width:100%;
    padding:4px;
    margin:5px 0;
}

#chartContainer{
    height:22vh;
    margin:8px;
    background:white;
    border-radius:10px;
    padding:8px;
}

/* legenda */
.legend {
    background:white;
    padding:8px;
    border-radius:6px;
    font-size:11px;
}
.legend i {
    width:10px;
    height:10px;
    float:left;
    margin-right:5px;
}
</style>
</head>

<body>

<h2>🌳 Peta Pengurus Jaga Leuweung</h2>

<div class="panel">
<b>Search</b>
<input type="text" id="search" placeholder="Nama...">

<b>Filter CDK</b>
<div id="filter"></div>
</div>

<div id="map"></div>

<div id="chartContainer">
<canvas id="chart"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= MAP =================
var map = L.map('map').setView([-6.9,107.6],8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ================= WARNA =================
function getColor(cdk){
    return {
        "CDK I":"#e74c3c",
        "CDK II":"#3498db",
        "CDK III":"#2ecc71",
        "CDK IV":"#f39c12",
        "CDK V":"#9b59b6",
        "CDK VI":"#8e5c42",
        "CDK VII":"#fd79a8",
        "CDK VIII":"#f1c40f",
        "CDK IX":"#2d3436"
    }[cdk] || "#95a5a6";
}

// ================= GLOBAL =================
var allData = [];
var markersLayer = L.layerGroup().addTo(map);
var activeCDK = new Set();

// ================= BATAS =================
fetch('Jawa Barat.geojson')
.then(res=>res.json())
.then(data=>{
    L.geoJSON(data,{
        style:{color:"black",weight:0.5,fillOpacity:0}
    }).addTo(map);
});

// ================= DATA =================
fetch('PJL.geojson')
.then(res=>res.json())
.then(data=>{

    allData = data.features;

    let cdkSet = new Set(allData.map(f=>f.properties.cdk));
    let filterDiv = document.getElementById("filter");

    cdkSet.forEach(cdk=>{
        activeCDK.add(cdk);
        filterDiv.innerHTML += `
        <label><input type="checkbox" checked value="${cdk}"> ${cdk}</label><br>`;
    });

    updateMap();

    filterDiv.addEventListener("change",()=>{
        activeCDK.clear();
        document.querySelectorAll("#filter input:checked")
        .forEach(i=>activeCDK.add(i.value));
        updateMap();
    });

    document.getElementById("search").addEventListener("input",updateMap);
});

// ================= UPDATE =================
function updateMap(){

    markersLayer.clearLayers();

    let keyword = document.getElementById("search").value.toLowerCase();
    let countCDK = {};

    allData.forEach(f=>{

        let p = f.properties;

        if(!activeCDK.has(p.cdk)) return;
        if(!(p.nama || "").toLowerCase().includes(keyword)) return;

        let lat = parseFloat(p["koordinat desa (lat)"]);
        let lng = parseFloat(p["koordinat desa (long)"]);

        // DEBUG kalau error
        if(isNaN(lat) || isNaN(lng)){
            console.log("Koordinat error:", p.nama, lat, lng);
            return;
        }

        let warna = getColor(p.cdk);

        let marker = L.circleMarker([lat,lng],{
            radius:1.5, // 🔥 FIX: biar kelihatan
            color:"#fff",
            weight:1,
            fillColor:warna,
            fillOpacity:0.9
        });

        marker.bindPopup(`
            <b>${p.nama || "-"}</b><hr>
            NIK: ${p.nik || "-"}<br>
            Usia: ${p["usia(tahun)"] || "-"}<br>
            Desa: ${p.desa || "-"}<br>
            Kecamatan: ${p.kecamatan || "-"}<br>
            Kabupaten: ${p.kabupaten || "-"}<br><br>
            <b>Koordinat Desa:</b><br>
            (${lat}, ${lng})<br><br>
            <b>Koordinat Calon Lokasi Persemaian:</b><br>
            (${p["koordinat calon lokasi persemaian (x)"] || "-"},
             ${p["koordinat calon lokasi persemaian (y)"] || "-"})<br><br>
            <b>Koordinat Calon Lokasi Penanaman:</b><br>
            (${p["koordinat calon lokasi penanaman (x)"] || "-"},
             ${p["koordinat calon lokasi penanaman (y)"] || "-"})<br><br>
             ${p["penyuluh kehutanan pendamping"] || "-"}<br><br> <b>
             Keterangan</b><br> ${p.keterangan || "-"}<br><br>
            CDK: ${p.cdk || "-"}
        `);

        markersLayer.addLayer(marker);

        countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;
    });

    updateChart(countCDK);
}

// ================= CHART =================
var chart;

function updateChart(data){

    let labels = Object.keys(data);
    let values = Object.values(data);
    let colors = labels.map(cdk => getColor(cdk));

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Jumlah PJL per CDK',
                data: values,
                backgroundColor: colors
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

// ================= LEGENDA =================
var legend = L.control({position:"bottomright"});

legend.onAdd = function(){
    var div = L.DomUtil.create("div","legend");

    var cdks = ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"];

    div.innerHTML += "<b>Legenda</b><br>";

    cdks.forEach(cdk=>{
        div.innerHTML += '<i style="background:'+getColor(cdk)+'"></i> '+cdk+'<br>';
    });

    return div;
};

legend.addTo(map);

</script>

</body>
</html>
