<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>WebGIS Jaga Leuweung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        h2 {
            text-align: center;
            margin: 10px;
        }
        #map {
            height: 90vh;
            width: 100%;
        }
    </style>
</head>
<body>

<h2>Peta Pengurus Jaga Leuweung</h2>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Basemap OSM
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    });

    // Basemap Satelit (ESRI)
    var satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
    });

    // Basemap Medan / Topografi
    var medan = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data: OpenTopoMap'
    });

    // Membuat peta
    var map = L.map('map', {
        center: [-6.723, 106.973],
        zoom: 10,
        layers: [osm] // default layer
    });

    // Layer control (pilihan peta)
    var baseMaps = {
        "OpenStreetMap": osm,
        "Satelit": satelit,
        "Medan": medan
    };

    L.control.layers(baseMaps).addTo(map);

    // Contoh marker
    L.marker([-6.723, 106.973])
        .addTo(map)
        .bindPopup("Contoh Lokasi Jaga Leuweung");
</script>

</body>
</html>
