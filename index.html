<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Pengurus Jaga Leuweung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin:0; font-family: Arial; }

        #panel {
            padding: 10px;
            background: #f0f0f0;
        }

        #map {
            height: 65vh;
        }

        #chartContainer {
            height: 250px;
            background: white;
            padding: 10px;
        }

        .leaflet-popup-content {
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div id="panel">
    <b>Pengurus Jaga Leuweung</b><br><br>

    Cari Nama:
    <input type="text" id="search">

    <br><br>

    <input type="checkbox" id="batasCheck" checked> Batas Administrasi
    <input type="checkbox" id="cdkCheck" checked> Titik PJL
</div>

<div id="map"></div>

<div id="chartContainer">
    <canvas id="chart"></canvas>
</div>

<script>
// ================= PETA =================
var map = L.map('map').setView([-6.9, 107.6], 9);

// ================= BASEMAP =================
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');

osm.addTo(map);

var baseMaps = {
    "OSM": osm,
    "Satelit": esri,
    "Medan": topo
};

L.control.layers(baseMaps).addTo(map);

// ================= WARNA CDK =================
function getColor(cdk){
    return cdk == "CDK I" ? "red" :
           cdk == "CDK II" ? "blue" :
           cdk == "CDK III" ? "green" :
           cdk == "CDK IV" ? "orange" :
           cdk == "CDK V" ? "purple" :
           cdk == "CDK VI" ? "brown" :
           cdk == "CDK VII" ? "black" :
           cdk == "CDK VIII" ? "pink" :
           cdk == "CDK IX" ? "yellow" :
           "gray";
}

// ================= CHART =================
var chart;
var ctx = document.getElementById("chart").getContext("2d");

chart = new Chart(ctx,{
    type:'bar',
    data:{
        labels: [],
        datasets:[{
            label:'Jumlah PJL per CDK',
            data: []
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:false
    }
});

// ================= LAYER =================
var geoLayer;
var batasLayer;
var allFeatures;

// ================= LOAD BATAS ADMIN =================
fetch("Jawa Barat.geojson")
.then(res => res.json())
.then(data => {
    batasLayer = L.geoJSON(data,{
        style:{
            color:"black",
            weight:0.5,
            fillOpacity:0
        }
    }).addTo(map);
});

// ================= LOAD DATA PJL =================
fetch("PJL.geojson")
.then(res => res.json())
.then(data => {
    allFeatures = data.features;
    updateMap();
});

// ================= UPDATE MAP =================
function updateMap(){

    if(geoLayer){
        map.removeLayer(geoLayer);
    }

    let keyword = document.getElementById("search").value.toLowerCase();
    let countCDK = {};

    geoLayer = L.geoJSON(allFeatures,{

        pointToLayer: function(feature){

            let lat = parseFloat(feature.properties["koordinat desa (lat)"]);
            let lng = parseFloat(feature.properties["koordinat desa (long)"]);

            if(isNaN(lat) || isNaN(lng)) return null;

            return L.circleMarker([lat,lng],{
                radius: 1,
                color: getColor(feature.properties.cdk),
                fillColor: getColor(feature.properties.cdk),
                fillOpacity: 1
            });
        },

        filter: function(feature){
            let p = feature.properties;
            return (p.nama || "").toLowerCase().includes(keyword);
        },

        onEachFeature: function(feature, layer){

            let p = feature.properties;

            if(p.cdk){
                countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;
            }

            layer.bindPopup(`
                <div style="font-size:13px">
                <b>DATA PENGURUS JAGA LEUWEUNG</b><hr>

                <b>Nama:</b> ${p.nama || "-"}<br>
                <b>NIK:</b> ${p.nik || "-"}<br>
                <b>Usia:</b> ${p["usia(tahun)"] || "-"} Tahun<br>
                <b>Alamat:</b> ${p.alamat || "-"}<br>
                <b>Desa:</b> ${p.desa || "-"}<br>
                <b>Kecamatan:</b> ${p.kecamatan || "-"}<br>
                <b>Kabupaten:</b> ${p.kabupaten || "-"}<br>
                <hr>
                <b>Koordinat Desa:</b><br>
                Lat: ${p["koordinat desa (lat)"] || "-"}<br>
                Long: ${p["koordinat desa (long)"] || "-"}<br>
                <hr>
                <b>Koordinat Calon Lokasi Persemaian:</b><br>
                X: ${p["koordinat calon lokasi persemaian (x)"] || "-"}<br>
                Y: ${p["koordinat calon lokasi persemaian (y)"] || "-"}<br>
                <hr>
                <b>Koordinat Calon Lokasi Penanaman:</b><br>
                X: ${p["koordinat calon lokasi penanaman (x)"] || "-"}<br>
                Y: ${p["koordinat calon lokasi penanaman (y)"] || "-"}<br>
                <hr>
                <b>CDK:</b> ${p.cdk || "-"}<br>
                <b>Penyuluh Kehutanan Pendamping:</b> ${p["penyuluh kehutanan pendamping"] || "-"}<br>
                <b>Keterangan:</b> ${p.keterangan || "-"}<br>
                </div>
            `);
        }
    });

    if(document.getElementById("cdkCheck").checked){
        geoLayer.addTo(map);
    }

    updateChart(countCDK);
}

// ================= UPDATE CHART =================
function updateChart(data){

    if(!data || Object.keys(data).length === 0){
        chart.data.labels = ["Tidak ada data"];
        chart.data.datasets[0].data = [0];
        chart.update();
        return;
    }

    chart.data.labels = Object.keys(data);
    chart.data.datasets[0].data = Object.values(data);
    chart.update();
}

// ================= CHECKBOX =================
document.getElementById("cdkCheck").addEventListener("change", function(){
    if(this.checked){
        map.addLayer(geoLayer);
    } else {
        map.removeLayer(geoLayer);
    }
});

document.getElementById("batasCheck").addEventListener("change", function(){
    if(this.checked){
        map.addLayer(batasLayer);
    } else {
        map.removeLayer(batasLayer);
    }
});

// ================= SEARCH =================
document.getElementById("search").addEventListener("input", updateMap);

</script>

</body>
</html>
