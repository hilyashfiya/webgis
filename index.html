<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Pengurus Jaga Leuweung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body { margin: 0; }
        #map { height: 100vh; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Basemap
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png');
    var satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
    var medan = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');

    // Map
    var map = L.map('map', {
        center: [-6.9, 107.6],
        zoom: 8,
        layers: [osm]
    });

    // Layer control
    var baseMaps = {
        "OpenStreetMap": osm,
        "Satelit": satelit,
        "Medan": medan
    };

    L.control.layers(baseMaps).addTo(map);

    // GeoJSON Jawa Barat
    fetch('Jawa Barat.geojson')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                style: {
                    color: "red",
                    weight: 0.5,
                    fillOpacity: 0
                }
            }).addTo(map);
        });

// ======================
// WARNA CDK
// ======================
function getColor(cdk) {
    return cdk == "CDK I" ? "red" :
           cdk == "CDK II" ? "blue" :
           cdk == "CDK III" ? "green" :
           cdk == "CDK IV" ? "orange" :
           cdk == "CDK V" ? "purple" :
           cdk == "CDK VI" ? "brown" :
           cdk == "CDK VII" ? "pink" :
           cdk == "CDK VIII" ? "yellow" :
           cdk == "CDK IX" ? "black" :
           "gray";
}

// ======================
// TITIK PENGURUS (KOORDINAT DESA)
// ======================
fetch('pengurus jaga leuweung.geojson')
    .then(response => response.json())
    .then(data => {
        L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {

                // Ambil koordinat dari atribut Excel (koordinat desa)
                var lat = feature.properties.field_10;
                var lng = feature.properties.koordinat desa;

                return L.circleMarker([lat, lng], {
                    radius: 6,
                    color: getColor(feature.properties.cdk),
                    fillColor: getColor(feature.properties.cdk),
                    fillOpacity: 1
                });
            },

            onEachFeature: function(feature, layer) {
                layer.bindPopup(
                    "<b>Nama:</b> " + feature.properties.nama +
                    "<br><b>NIK:</b> " + feature.properties.nik +
                    "<br><b>Usia:</b> " + feature.properties["usia(tahun)"] +
                    "<br><b>Alamat:</b> " + feature.properties.alamat +
                    "<br><b>Desa:</b> " + feature.properties.desa +
                    "<br><b>Kecamatan:</b> " + feature.properties.kecamatan +
                    "<br><b>Kabupaten:</b> " + feature.properties.kabupaten +
                    "<br><b>Penyuluh Kehutanan:</b> " + feature.properties["penyuluh kehutanan"] +
                    "<br><b>Keterangan:</b> " + feature.properties.keterangan +
                    "<br><b>CDK:</b> " + feature.properties.cdk
                );
            }

        }).addTo(map);
    });

// ======================
// LEGENDA
// ======================
var legend = L.control({position: "bottomright"});

legend.onAdd = function(map) {
    var div = L.DomUtil.create("div", "legend");
    div.innerHTML += "<b>Legenda CDK</b><br>";
    div.innerHTML += "<i style='background:red;width:12px;height:12px;display:inline-block;'></i> CDK I<br>";
    div.innerHTML += "<i style='background:blue;width:12px;height:12px;display:inline-block;'></i> CDK II<br>";
    div.innerHTML += "<i style='background:green;width:12px;height:12px;display:inline-block;'></i> CDK III<br>";
    div.innerHTML += "<i style='background:orange;width:12px;height:12px;display:inline-block;'></i> CDK IV<br>";
    div.innerHTML += "<i style='background:purple;width:12px;height:12px;display:inline-block;'></i> CDK V<br>";
    div.innerHTML += "<i style='background:brown;width:12px;height:12px;display:inline-block;'></i> CDK VI<br>";
    div.innerHTML += "<i style='background:pink;width:12px;height:12px;display:inline-block;'></i> CDK VII<br>";
    div.innerHTML += "<i style='background:yellow;width:12px;height:12px;display:inline-block;'></i> CDK VIII<br>";
    div.innerHTML += "<i style='background:black;width:12px;height:12px;display:inline-block;'></i> CDK IX<br>";
    return div;
};

legend.addTo(map);

</script>

</body>
</html>
