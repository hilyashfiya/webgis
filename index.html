<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>WebGIS Jawa Barat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body { margin: 0; }
        #map { height: 100vh; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Basemap
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png');
    var satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
    var medan = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');

    // Map
    var map = L.map('map', {
        center: [-6.9, 107.6],
        zoom: 8,
        layers: [osm]
    });

    // Layer control
    var baseMaps = {
        "OpenStreetMap": osm,
        "Satelit": satelit,
        "Medan": medan
    };

    L.control.layers(baseMaps).addTo(map);

    // GeoJSON Jawa Barat
    fetch('Jawa Barat.geojson')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                style: {
                    color: "red",
                    weight: 0.5,
                    fillOpacity: 0
                }
            }).addTo(map);
        });

</script>

</body>
</html>
