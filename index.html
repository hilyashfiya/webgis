<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>WebGIS Pengurus Jaga Leuweung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin: 0; font-family: Arial, sans-serif; }

        #map { height: 100vh; }

        /* PANEL KIRI */
        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 260px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 16px;
            text-align: center;
        }

        .panel input {
            width: 100%;
            padding: 6px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .panel label {
            display: block;
            margin-bottom: 5px;
        }

        /* GRAFIK POJOK KANAN BAWAH */
        .chartBox {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 200px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- PANEL -->
<div class="panel">
    <h3>Filter Data Peserta</h3>

    <input type="text" id="searchInput" placeholder="Cari Nama...">

    <b>Filter CDK:</b>
    <label><input type="checkbox" value="CDK I" checked> CDK I</label>
    <label><input type="checkbox" value="CDK II" checked> CDK II</label>
    <label><input type="checkbox" value="CDK III" checked> CDK III</label>
    <label><input type="checkbox" value="CDK IV" checked> CDK IV</label>
    <label><input type="checkbox" value="CDK V" checked> CDK V</label>
    <label><input type="checkbox" value="CDK VI" checked> CDK VI</label>
    <label><input type="checkbox" value="CDK VII" checked> CDK VII</label>
    <label><input type="checkbox" value="CDK VIII" checked> CDK VIII</label>
    <label><input type="checkbox" value="CDK IX" checked> CDK IX</label>
</div>

<!-- GRAFIK -->
<div class="chartBox">
    <canvas id="chartCDK"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([-6.9, 107.6], 9);

// Basemap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OpenStreetMap'
}).addTo(map);

// Warna CDK
function getColor(cdk) {
    return cdk === "CDK I" ? "red" :
           cdk === "CDK II" ? "blue" :
           cdk === "CDK III" ? "green" :
           cdk === "CDK IV" ? "orange" :
           cdk === "CDK V" ? "purple" :
           cdk === "CDK VI" ? "brown" :
           cdk === "CDK VII" ? "pink" :
           cdk === "CDK VIII" ? "gray" :
           cdk === "CDK IX" ? "black" :
           "yellow";
}

var geojsonLayer;
var chart;

// Batas Administrasi Jawa Barat
fetch("Jawa Barat.geojson")
.then(res => res.json())
.then(data => {
    var batasJabar = L.geoJSON(data, {
        style: {
            color: "black",
            weight: 0.5,
            fillOpacity: 0
        }
    }).addTo(map);

    map.fitBounds(batasJabar.getBounds());
});

// Load GeoJSON
fetch("PJL.geojson")
.then(res => res.json())
.then(data => {

    function filterData(feature) {
        var keyword = document.getElementById("searchInput").value.toLowerCase();
        var checked = Array.from(document.querySelectorAll("input[type=checkbox]:checked"))
                            .map(cb => cb.value);

        return checked.includes(feature.properties.cdk) &&
               feature.properties.nama.toLowerCase().includes(keyword);
    }

    function updateMap() {

        if (geojsonLayer) map.removeLayer(geojsonLayer);

        var countCDK = {};

        geojsonLayer = L.geoJSON(data, {
            filter: function(feature) {
                return filterData(feature);
            },

            pointToLayer: function(feature, latlng) {
                return L.circleMarker(latlng, {
                    radius: 1,
                    fillColor: getColor(feature.properties.cdk),
                    color: "#000",
                    weight: 1,
                    fillOpacity: 0.9
                });
            },

            onEachFeature: function(feature, layer) {
                var p = feature.properties;

                layer.bindPopup(`
                    <b>Nama:</b> ${p.nama}<br>
                    <b>NIK:</b> ${p.nik}<br>
                    <b>Usia:</b> ${p["usia(tahun)"]} tahun<br>
                    <b>Alamat:</b> ${p.alamat}<br>
                    <b>Desa:</b> ${p.desa}<br>
                    <b>Kecamatan:</b> ${p.kecamatan}<br>
                    <b>Kabupaten:</b> ${p.kabupaten}<br><br>
                    <b>Koordinat Desa:</b><br>
                    (${p["koordinat desa (lat)"]}, ${p["koordinat desa (long)"]})<br><br>
                    <b>Koordinat Calon Lokasi Persemaian:</b><br>
                    (${p["koordinat calon lokasi persemaian (x)"]}, ${p["koordinat calon lokasi persemaian (y)"]})<br><br>
                    <b>Koordinat Calon Lokasi Penanaman:</b><br>
                    (${p["koordinat calon lokasi penanaman (x)"]}, ${p["koordinat calon lokasi penanaman (y)"]})<br><br>
                    <b>Penyuluh Kehutanan Pendamping:</b> ${p["penyuluh kehutanan pendamping"]}<br>
                    <b>Keterangan:</b> ${p.keterangan}<br>
                    <b>CDK:</b> ${p.cdk}
                `);

                // Hitung grafik
                countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;
            }
        }).addTo(map);

        updateChart(countCDK);
    }

    function updateChart(countCDK) {
        var ctx = document.getElementById('chartCDK');

        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(countCDK),
                datasets: [{
                    label: 'Jumlah Peserta',
                    data: Object.values(countCDK)
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    document.getElementById("searchInput").addEventListener("keyup", updateMap);
    document.querySelectorAll("input[type=checkbox]").forEach(cb => {
        cb.addEventListener("change", updateMap);
    });

    updateMap();
});
</script>

</body>
</html>
