<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Pengurus Jaga Leuweung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { margin:0; font-family: Arial; }

        #panel {
            padding: 10px;
            background: #f0f0f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #map {
            height: 60vh;
            width: 100%;
        }

        #chartContainer {
            width: 100%;
            height: 280px;
            padding: 10px;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #chart {
            width: 100% !important;
            height: 100% !important;
        }

        .leaflet-popup-content {
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div id="panel">
    <b>Pengurus Jaga Leuweung</b><br><br>

    Cari Nama:
    <input type="text" id="search">

    <br><br>

    <b>Layer:</b><br>
    <input type="checkbox" id="batasCheck" checked> Batas Administrasi
    <input type="checkbox" id="pjlCheck" checked> Titik PJL

    <br><br>
    <b>Filter CDK:</b><br>
    <input type="checkbox" class="cdkFilter" value="CDK I" checked> CDK I
    <input type="checkbox" class="cdkFilter" value="CDK II" checked> CDK II
    <input type="checkbox" class="cdkFilter" value="CDK III" checked> CDK III
    <input type="checkbox" class="cdkFilter" value="CDK IV" checked> CDK IV
    <input type="checkbox" class="cdkFilter" value="CDK V" checked> CDK V
    <input type="checkbox" class="cdkFilter" value="CDK VI" checked> CDK VI
    <input type="checkbox" class="cdkFilter" value="CDK VII" checked> CDK VII
    <input type="checkbox" class="cdkFilter" value="CDK VIII" checked> CDK VIII
    <input type="checkbox" class="cdkFilter" value="CDK IX" checked> CDK IX
</div>

<div id="map"></div>

<div id="chartContainer">
    <canvas id="chart"></canvas>
</div>

<script>
// ================= PETA =================
var map = L.map('map').setView([-6.9, 107.6], 9);

// ================= BASEMAP =================
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');

osm.addTo(map);

L.control.layers({
    "OSM": osm,
    "Satelit": esri,
    "Medan": topo
}).addTo(map);

// ================= WARNA CDK =================
function getColor(cdk){
    return cdk == "CDK I" ? "red" :
           cdk == "CDK II" ? "blue" :
           cdk == "CDK III" ? "green" :
           cdk == "CDK IV" ? "orange" :
           cdk == "CDK V" ? "purple" :
           cdk == "CDK VI" ? "brown" :
           cdk == "CDK VII" ? "black" :
           cdk == "CDK VIII" ? "pink" :
           cdk == "CDK IX" ? "yellow" :
           "gray";
}

// ================= CHART =================
var chart;
var ctx = document.getElementById("chart").getContext("2d");

chart = new Chart(ctx,{
    type:'bar',
    data:{
        labels: [],
        datasets:[{
            label:'Jumlah PJL per CDK',
            data: []
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:false
    }
});

// ================= LOAD DATA =================
var geoLayer;
var batasLayer;
var allFeatures;

// Batas Administrasi
fetch("Jawa Barat.geojson")
.then(res => res.json())
.then(data => {
    batasLayer = L.geoJSON(data,{
        style:{ color:black", weight:0.5, fillOpacity:0 }
    }).addTo(map);
});

// Titik PJL
fetch("PJL.geojson")
.then(res => res.json())
.then(data => {
    allFeatures = data.features;
    updateMap();
});

// ================= UPDATE MAP =================
function updateMap(){

    if(geoLayer){
        map.removeLayer(geoLayer);
    }

    let keyword = document.getElementById("search").value.toLowerCase();
    let countCDK = {};

    // Ambil CDK yang dicentang
    let selectedCDK = [];
    document.querySelectorAll(".cdkFilter:checked").forEach(function(cb){
        selectedCDK.push(cb.value);
    });

    geoLayer = L.geoJSON(allFeatures,{

        pointToLayer: function(feature){
            let lat = parseFloat(feature.properties["koordinat desa (lat)"]);
            let lng = parseFloat(feature.properties["koordinat desa (long)"]);

            if(isNaN(lat) || isNaN(lng)) return null;

            return L.circleMarker([lat,lng],{
                radius: 1,
                color: getColor(feature.properties.cdk),
                fillColor: getColor(feature.properties.cdk),
                fillOpacity: 1
            });
        },

        filter: function(feature){
            let p = feature.properties;
            return (p.nama || "").toLowerCase().includes(keyword) &&
                   selectedCDK.includes(p.cdk);
        },

        onEachFeature: function(feature, layer){

            let p = feature.properties;

            if(p.cdk){
                countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;
            }

            // ===== POPUP LENGKAP =====
            layer.bindPopup(`
                <div style="font-size:13px">
                <b>DATA PENGURUS JAGA LEUWEUNG</b><hr>

                <b>Nama:</b> ${p.nama || "-"}<br>
                <b>NIK:</b> ${p.nik || "-"}<br>
                <b>Usia:</b> ${p["usia(tahun)"] || "-"} Tahun<br>
                <b>Alamat:</b> ${p.alamat || "-"}<br>
                <b>Desa:</b> ${p.desa || "-"}<br>
                <b>Kecamatan:</b> ${p.kecamatan || "-"}<br>
                <b>Kabupaten:</b> ${p.kabupaten || "-"}<br>
                <hr>
                <b>Koordinat Desa:</b><br>
                Lat: ${p["koordinat desa (lat)"] || "-"}<br>
                Long: ${p["koordinat desa (long)"] || "-"}<br>
                <hr>
                <b>Koordinat Calon Lokasi Persemaian:</b><br>
                X: ${p["koordinat calon lokasi persemaian (x)"] || "-"}<br>
                Y: ${p["koordinat calon lokasi persemaian (y)"] || "-"}<br>
                <hr>
                <b>Koordinat Calon Lokasi Penanaman:</b><br>
                X: ${p["koordinat calon lokasi penanaman (x)"] || "-"}<br>
                Y: ${p["koordinat calon lokasi penanaman (y)"] || "-"}<br>
                <hr>
                <b>CDK:</b> ${p.cdk || "-"}<br>
                <b>Penyuluh:</b> ${p["penyuluh kehutanan pendamping"] || "-"}<br>
                <b>Keterangan:</b> ${p.keterangan || "-"}<br>
                </div>
            `);
        }
    });

    if(document.getElementById("pjlCheck").checked){
        geoLayer.addTo(map);
    }

    updateChart(countCDK);
}

// ================= CHART UPDATE =================
function updateChart(data){
    if(!data || Object.keys(data).length === 0){
        chart.data.labels = ["Tidak ada data"];
        chart.data.datasets[0].data = [0];
        chart.update();
        return;
    }

    chart.data.labels = Object.keys(data);
    chart.data.datasets[0].data = Object.values(data);
    chart.update();
}

// ================= EVENT =================
document.getElementById("search").addEventListener("input", updateMap);
document.getElementById("pjlCheck").addEventListener("change", updateMap);

document.getElementById("batasCheck").addEventListener("change", function(){
    if(this.checked){
        map.addLayer(batasLayer);
    } else {
        map.removeLayer(batasLayer);
    }
});

document.querySelectorAll(".cdkFilter").forEach(function(cb){
    cb.addEventListener("change", updateMap);
});

</script>

</body>
</html>
