<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>WebGIS Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:Arial;}
#map {height:100vh;}

.panel{
position:absolute;top:10px;left:10px;width:250px;
background:#1b5e20;color:white;padding:12px;border-radius:10px;
z-index:1000;
}

.panel input{width:100%;margin-bottom:8px;padding:5px;border-radius:5px;border:none;}
.panel label{display:block;font-size:13px;}

.chartBox{
position:absolute;bottom:10px;right:10px;
width:260px;height:170px;background:white;padding:10px;border-radius:10px;
}

.title{
position:absolute;top:10px;left:50%;transform:translateX(-50%);
background:white;padding:8px;border-radius:8px;font-weight:bold;
}

.legend{
background:white;padding:8px;border-radius:6px;font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="title">Sebaran Pengurus Jaga Leuweung</div>

<div class="panel">
<input type="text" id="search" placeholder="Cari nama/desa">

<label><input type="checkbox" id="toggleBatas" checked> Batas</label>
<label><input type="checkbox" id="toggleTitik" checked> Titik</label>

<b>CDK</b>
<label><input type="checkbox" class="cdk" value="CDK I" checked> CDK I</label>
<label><input type="checkbox" class="cdk" value="CDK II" checked> CDK II</label>
<label><input type="checkbox" class="cdk" value="CDK III" checked> CDK III</label>
<label><input type="checkbox" class="cdk" value="CDK IV" checked> CDK IV</label>
<label><input type="checkbox" class="cdk" value="CDK V" checked> CDK V</label>
<label><input type="checkbox" class="cdk" value="CDK VI" checked> CDK VI</label>
<label><input type="checkbox" class="cdk" value="CDK VII" checked> CDK VII</label>
<label><input type="checkbox" class="cdk" value="CDK VIII" checked> CDK VIII</label>
<label><input type="checkbox" class="cdk" value="CDK IX" checked> CDK IX</label>

<div id="summary"></div>
</div>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<script>
// MAP
var map = L.map('map').setView([-6.9,107.6],9);

// BASEMAP
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// COLOR
function getColor(c){
return {"CDK I":"red","CDK II":"blue","CDK III":"green","CDK IV":"orange","CDK V":"purple","CDK VI":"brown","CDK VII":"pink","CDK VIII":"gray","CDK IX":"black"}[c]||"yellow";
}

var batasLayer, cluster, chart, dataGlobal;

// LOAD BATAS
fetch("Jawa Barat.geojson")
.then(r=>r.json())
.then(d=>{
batasLayer=L.geoJSON(d,{style:{color:"black",weight:0.5,fillOpacity:0}}).addTo(map);
});

// LOAD DATA
fetch("PJL.geojson")
.then(r=>r.json())
.then(d=>{
dataGlobal=d;
updateMap();
});

// UPDATE
function updateMap(){

if(cluster) map.removeLayer(cluster);

cluster=L.markerClusterGroup();

let keyword=document.getElementById("search").value.toLowerCase();
let selected=[...document.querySelectorAll(".cdk:checked")].map(i=>i.value);

let count={};

dataGlobal.features.forEach(f=>{

let p=f.properties;

// VALIDASI KOORDINAT
let lat=parseFloat(p["koordinat desa (lat)"]);
let lng=parseFloat(p["koordinat desa (long)"]);

if(isNaN(lat)||isNaN(lng)) return;

// FILTER
if(!selected.includes(p.cdk)) return;
if(!(p.nama||"").toLowerCase().includes(keyword) &&
   !(p.desa||"").toLowerCase().includes(keyword)) return;

// MARKER
let m=L.circleMarker([lat,lng],{
radius:5,
color:getColor(p.cdk),
fillColor:getColor(p.cdk),
fillOpacity:1
});

// HOVER EFFECT
m.on("mouseover",()=>m.setStyle({radius:8}));
m.on("mouseout",()=>m.setStyle({radius:5}));

// POPUP
m.bindPopup(`
<b>IDENTITAS</b><hr>
${p.nama||"-"}<br>
${p.nik||"-"}<br>
${p["usia(tahun)"]||"-"} th<br>

<b>LOKASI</b><hr>
${p.desa||"-"}, ${p.kecamatan||"-"}<br>

<b>KOORDINAT</b><hr>
Desa: (${lat},${lng})<br>
Penanaman: ${
p["koordinat calon lokasi penanaman (x)"]?
`(${p["koordinat calon lokasi penanaman (x)"]},${p["koordinat calon lokasi penanaman (y)"]})`
:"Tidak ada data"}<br>

<b>INFO</b><hr>
${p["penyuluh kehutanan pendamping"]||"-"}<br>
${p.keterangan||"-"}<br>
${p.cdk}
`);

cluster.addLayer(m);

// COUNT
count[p.cdk]=(count[p.cdk]||0)+1;

});

// ADD KE MAP
if(document.getElementById("toggleTitik").checked){
map.addLayer(cluster);
}

// SUMMARY
let total=Object.values(count).reduce((a,b)=>a+b,0);
document.getElementById("summary").innerHTML="<hr>Total: "+total;

// ZOOM
if(cluster.getLayers().length>0){
map.fitBounds(cluster.getBounds());
}

// CHART
updateChart(count);
}

// CHART
function updateChart(data){
if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:Object.keys(data),
datasets:[{data:Object.values(data)}]
},
options:{
plugins:{legend:{display:false}},
onClick:function(e){
let p=chart.getElementsAtEventForMode(e,'nearest',{intersect:true},true);
if(p.length){
let cdk=chart.data.labels[p[0].index];
document.querySelectorAll(".cdk").forEach(cb=>cb.checked=cb.value===cdk);
updateMap();
}
}
}
});
}

// EVENT
document.getElementById("search").addEventListener("input",updateMap);
document.querySelectorAll(".cdk").forEach(cb=>cb.addEventListener("change",updateMap));

document.getElementById("toggleBatas").addEventListener("change",function(){
this.checked?map.addLayer(batasLayer):map.removeLayer(batasLayer);
});

document.getElementById("toggleTitik").addEventListener("change",updateMap);

// LEGENDA
L.control({position:"topright"}).onAdd=function(){
let d=L.DomUtil.create("div","legend");
d.innerHTML="<b>Legenda</b><br>";
["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"]
.forEach(c=>{
d.innerHTML+=`<i style="background:${getColor(c)};
width:10px;height:10px;display:inline-block;"></i> ${c}<br>`;
});
return d;
}.addTo(map);

</script>

</body>
</html>
