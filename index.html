<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Pengurus Jaga Leuweung</title> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin: 0; font-family: Arial, sans-serif; }
h2 { text-align: center; margin: 10px; }
#map { height: 92vh; width: 100%; }

.legend {
    background: white;
    padding: 10px;
    line-height: 18px;
    border-radius: 5px;
}

.panel{
    position:absolute;
    top:70px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    width:210px;
}

.chartBox{
    position:absolute;
    bottom:10px;
    left:10px;
    width:260px;
    height:180px;
    background:white;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>Peta Pengurus Jaga Leuweung</h2>

<div class="panel">
<b>🔍 Search Nama</b>
<input type="text" id="search" style="width:100%; margin:5px 0;">

<b>📊 Filter CDK</b>
<div id="filterCDK"></div>

<hr>
<b>🗺️ Layer</b><br>
<label><input type="checkbox" id="batasCheck" checked> Batas Administrasi</label><br>
<label><input type="checkbox" id="cdkCheck" checked> Titik PJL</label>
</div>

<div id="map"></div>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= BASEMAP =================
var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png');
var satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
var medan = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png');

var map = L.map('map', {
    center: [-6.9,107.6],
    zoom: 8,
    layers: [osm]
});

var baseMaps = {
    "OSM": osm,
    "Satelit": satelit,
    "Medan": medan
};

L.control.layers(baseMaps).addTo(map);

// ================= WARNA CDK =================
function getColor(cdk){
    return cdk == "CDK I" ? "red" :
           cdk == "CDK II" ? "blue" :
           cdk == "CDK III" ? "green" :
           cdk == "CDK IV" ? "orange" :
           cdk == "CDK V" ? "purple" :
           cdk == "CDK VI" ? "brown" :
           cdk == "CDK VII" ? "pink" :
           cdk == "CDK VIII" ? "yellow" :
           cdk == "CDK IX" ? "black" : "gray";
}

// ================= GLOBAL =================
var allFeatures = [];
var activeCDK = new Set();
var geoLayer;
var batasLayer;
var chart;

// ================= INIT CHART (AWAL) =================
var ctx = document.getElementById("chart").getContext("2d");
chart = new Chart(ctx,{
    type:'bar',
    data:{
        labels: [],
        datasets:[{
            label:'Jumlah PJL',
            data: []
        }]
    },
    options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:false
    }
});

// ================= BATAS =================
fetch('Jawa Barat.geojson')
.then(res=>res.json())
.then(data=>{
    batasLayer = L.geoJSON(data,{
        style:{color:"black",weight:0.5,fillOpacity:0}
    }).addTo(map);
});

// ================= DATA PJL =================
fetch('PJL.geojson')
.then(res=>res.json())
.then(data=>{

    allFeatures = data.features;

    let cdkSet = new Set(allFeatures.map(f=>f.properties.cdk));
    let filterDiv = document.getElementById("filterCDK");

    cdkSet.forEach(cdk=>{
        activeCDK.add(cdk);
        filterDiv.innerHTML += `
        <label><input type="checkbox" checked value="${cdk}"> ${cdk}</label><br>`;
    });

    updateMap();

    filterDiv.addEventListener("change",()=>{
        activeCDK.clear();
        document.querySelectorAll("#filterCDK input:checked")
        .forEach(i=>activeCDK.add(i.value));
        updateMap();
    });

    // SEARCH DELAY
    let timer;
    document.getElementById("search").addEventListener("input", function(){
        clearTimeout(timer);
        timer = setTimeout(updateMap, 300);
    });
});

// ================= UPDATE MAP =================
function updateMap(){

    if(geoLayer){
        map.removeLayer(geoLayer);
    }

    let keyword = document.getElementById("search").value.toLowerCase();
    let countCDK = {};
    let hasData = false;

    geoLayer = L.geoJSON(allFeatures,{

        pointToLayer: function(feature){

            let lat = parseFloat(feature.properties["koordinat desa (lat)"]);
            let lng = parseFloat(feature.properties["koordinat desa (long)"]);

            if(isNaN(lat) || isNaN(lng)) return null;

            return L.circleMarker([lat,lng],{
                radius: 1,
                color:getColor(feature.properties.cdk),
                fillColor:getColor(feature.properties.cdk),
                fillOpacity:1
            });
        },

        filter: function(feature){
            let p = feature.properties;
            let lolos = activeCDK.has(p.cdk) &&
                        (p.nama || "").toLowerCase().includes(keyword);

            if(lolos) hasData = true;
            return lolos;
        },

        onEachFeature: function(feature,layer){

            let p = feature.properties;

            if(p.cdk){
                countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;
            }

            // POPUP LENGKAP
            layer.bindPopup(`
                <b>Nama:</b> ${p.nama || "-"}<br>
                <b>NIK:</b> ${p.nik || "-"}<br>
                <b>Usia:</b> ${p["usia(tahun)"] || "-"} tahun<br>
                <b>Alamat:</b> ${p.alamat || "-"}<br>
                <b>Desa:</b> ${p.desa || "-"}<br>
                <b>Kecamatan:</b> ${p.kecamatan || "-"}<br>
                <b>Kabupaten:</b> ${p.kabupaten || "-"}<br><br>
                <b>Koordinat Desa:</b><br>
                (${p["koordinat desa (lat)"]}, ${p["koordinat desa (long)"]})<br><br>
                <b>Koordinat Calon Lokasi Persemaian:</b><br>
                (${p["koordinat calon lokasi persemaian (x)"]}, ${p["koordinat calon lokasi persemaian (y)"]})<br><br>
                <b>Koordinat Calon Lokasi Penanaman:</b><br>
                (${p["koordinat calon lokasi penanaman (x)"]}, ${p["koordinat calon lokasi penanaman (y)"]})<br><br>
                <b>Penyuluh Kehutanan Pendamping:</b> ${p["penyuluh kehutanan pendamping"] || "-"}<br>
                <b>Keterangan:</b> ${p.keterangan || "-"}<br>
                <b>CDK:</b> ${p.cdk || "-"}
            `);
        }

    });

    if(document.getElementById("cdkCheck").checked){
        geoLayer.addTo(map);
    }

    // UPDATE CHART
    updateChart(countCDK);
}

// ================= UPDATE CHART TANPA HILANG =================
function updateChart(data){

    if(!data || Object.keys(data).length === 0){
        chart.data.labels = ["Tidak ada data"];
        chart.data.datasets[0].data = [0];
        chart.update();
        return;
    }

    chart.data.labels = Object.keys(data);
    chart.data.datasets[0].data = Object.values(data);
    chart.update();
}

// ================= CHECKBOX LAYER =================
document.getElementById("batasCheck").addEventListener("change", function(){
    if(this.checked){
        map.addLayer(batasLayer);
    } else {
        map.removeLayer(batasLayer);
    }
});

document.getElementById("cdkCheck").addEventListener("change", function(){
    updateMap();
});

// ================= LEGENDA =================
var legend = L.control({position:"bottomright"});

legend.onAdd = function(){
    var div = L.DomUtil.create("div","legend");
    div.innerHTML += "<b>Legenda CDK</b><br>";
    ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"]
    .forEach(cdk=>{
        div.innerHTML += `<i style="background:${getColor(cdk)};width:12px;height:12px;display:inline-block;"></i> ${cdk}<br>`;
    });
    return div;
};

legend.addTo(map);

</script>

</body>
</html>
