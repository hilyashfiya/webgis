<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Sebaran Pengurus Jaga Leuweung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }

/* JUDUL */
.judul {
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 20px;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.3);
    z-index:1000;
}

/* PANEL KIRI BAWAH */
.panel {
    position:absolute;
    bottom:10px;
    left:10px;
    width:320px;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 6px rgba(0,0,0,0.3);
    z-index:1000;
}

.legend {
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.3);
    line-height:18px;
}

canvas {
    background:white;
    margin-top:10px;
}
</style>
</head>
<body>

<div id="map"></div>

<div class="judul">
Sebaran Pengurus Jaga Leuweung Provinsi Jawa Barat
</div>

<div class="panel">
    <div id="summaryBox"></div>
    <canvas id="chartCDK"></canvas>
</div>

<script>

// ================= BASEMAP =================
var map = L.map('map').setView([-6.9,107.6], 8);

var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM'});
var satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'});
var medan = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'});

osm.addTo(map);

L.control.layers({
    "OpenStreetMap": osm,
    "Satelit": satelit,
    "Medan": medan
}).addTo(map);

// ================= WARNA CDK =================
function getColor(cdk){
    return {
        "CDK I":"red",
        "CDK II":"blue",
        "CDK III":"green",
        "CDK IV":"orange",
        "CDK V":"purple",
        "CDK VI":"brown",
        "CDK VII":"pink",
        "CDK VIII":"gray",
        "CDK IX":"black"
    }[cdk] || "black";
}

// DATA KOSONG
function isiData(data){
    return (data == null || data == "") ? "Data Tidak Tersedia" : data;
}

// ================= LOAD DATA =================
// GANTI pjl.geojson & batas.geojson dengan file kamu
var allData;
var batas;
var pjlLayer;
var chart;
let activeCDK = ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"];

fetch("PJL.geojson")
.then(res=>res.json())
.then(data=>{
    allData = data;
    updateMap();
});

fetch("Jawa Barat.geojson")
.then(res=>res.json())
.then(data=>{
    batas = L.geoJSON(data,{
        style:{
            color:"black",
            weight:0.5,
            fillOpacity:0
        }
    }).addTo(map);
});

// ================= UPDATE MAP =================
function updateMap(){

    if(pjlLayer) map.removeLayer(pjlLayer);

    let countCDK = {};
    let boundsByCDK = {};
    let total = 0;
    let bounds = [];

    pjlLayer = L.geoJSON(allData,{
        filter: f => activeCDK.includes(f.properties.cdk),

        pointToLayer: function(f,latlng){
            bounds.push(latlng);
            total++;
            return L.circleMarker(latlng,{
                radius:1,
                color:getColor(f.properties.cdk),
                fillColor:getColor(f.properties.cdk),
                fillOpacity:1
            });
        },

        onEachFeature: function(f,l){
            let p = f.properties;

           l.bindPopup(`
<b>Nama:</b> ${isiData(p.nama)}<br>
<b>NIK:</b> ${isiData(p.nik)}<br>
<b>Usia:</b> ${isiData(p["usia(tahun)"])} tahun<br>
<b>Alamat:</b> ${isiData(p.alamat)}<br>
<b>Desa:</b> ${isiData(p.desa)}<br>
<b>Kecamatan:</b> ${isiData(p.kecamatan)}<br>
<b>Kabupaten:</b> ${isiData(p.kabupaten)}<br><br>
<b>Koordinat Desa:</b><br>
Lat: ${isiData(p["koordinat desa (lat)"])}<br>
Long: ${isiData(p["koordinat desa (long)"])}<br><br>
<b>Koordinat Calon Lokasi Persemaian:</b><br>
X: ${isiData(p["koordinat calon lokasi persemaian (x)"])}<br>
Y: ${isiData(p["koordinat calon lokasi persemaian (y)"])}<br><br>
<b>Koordinat Calon Lokasi Penanaman:</b><br>
X: ${isiData(p["koordinat calon lokasi penanaman (x)"])}<br>
Y: ${isiData(p["koordinat calon lokasi penanaman (y)"])}<br><br>
<b>Penyuluh Kehutanan Pendamping:</b><br>
${isiData(p["penyuluh kehutanan pendamping"])}<br><br>
<b>Keterangan:</b><br>
${isiData(p.keterangan)}<br><br>
<b>CDK:</b> ${isiData(p.cdk)}
`);

            countCDK[p.cdk] = (countCDK[p.cdk] || 0) + 1;

            if(!boundsByCDK[p.cdk]) boundsByCDK[p.cdk] = [];
            boundsByCDK[p.cdk].push(l.getLatLng());

            l.on('click', function(){
                map.setView(l.getLatLng(), 14);
            });
        }
    }).addTo(map);

    updateChart(countCDK, boundsByCDK);
    updateSummary(countCDK, total);
}

// ================= SUMMARY TOP 3 =================
function updateSummary(data,total){
    let sorted = Object.entries(data)
        .sort((a,b)=>b[1]-a[1])
        .slice(0,3);

    let html = "<b>Top 3 CDK</b><br>";
    html += "Total Titik: " + total + "<br><br>";

    sorted.forEach(d=>{
        html += d[0] + ": " + d[1] + "<br>";
    });

    document.getElementById("summaryBox").innerHTML = html;
}

// ================= CHART =================
function updateChart(data, boundsByCDK){
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chartCDK"),{
        type:'bar',
        data:{
            labels:Object.keys(data),
            datasets:[{data:Object.values(data)}]
        },
        options:{
            onClick: function(evt, item){
                if(item.length > 0){
                    let cdk = this.data.labels[item[0].index];
                    activeCDK = [cdk];
                    updateMap();
                    if(boundsByCDK[cdk]){
                        map.fitBounds(boundsByCDK[cdk]);
                    }
                }
            },
            plugins:{
                legend:{display:false},
                title:{
                    display:true,
                    text:'Jumlah PJL per CDK'
                }
            }
        }
    });
}

// ================= LEGENDA INTERAKTIF =================
var legend = L.control({position:"topright"});

legend.onAdd = function(){
    var div = L.DomUtil.create("div","legend");
    div.innerHTML = "<b>Legenda (Klik)</b><br>";

    ["CDK I","CDK II","CDK III","CDK IV","CDK V","CDK VI","CDK VII","CDK VIII","CDK IX"]
    .forEach(c=>{
        let aktif = activeCDK.includes(c);
        div.innerHTML += `
        <div onclick="toggleCDK('${c}')"
        style="cursor:pointer; opacity:${aktif?1:0.3}">
        <i style="background:${getColor(c)};
        width:12px;height:12px;display:inline-block;"></i> ${c}
        </div>`;
    });

    return div;
};

legend.addTo(map);

function toggleCDK(cdk){
    if(activeCDK.includes(cdk)){
        activeCDK = activeCDK.filter(c=>c !== cdk);
    } else {
        activeCDK.push(cdk);
    }
    updateMap();
    legend.remove();
    legend.addTo(map);
}

</script>
</body>
</html>
